[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specinv"
version = "0.1.0"
description = "SpecInv: a reference implementation of SC-Net, adaptive spectral filtering for ill-posed inverse problems (arXiv:2603.20602)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SpecInv contributors" }]
keywords = [
    "inverse-problems",
    "regularization",
    "operator-learning",
    "spectral-filtering",
    "discretization-invariance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "matplotlib>=3.7",
]

[project.scripts]
specinv-convergence = "specinv.experiments.convergence:main"
specinv-zeroshot = "specinv.experiments.zero_shot:main"
specinv-filters = "specinv.experiments.filters:main"
specinv-all = "specinv.experiments.run_all:main"

[project.urls]
Paper = "https://arxiv.org/abs/2603.20602"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specinv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N803", "N806", "B008"]

[tool.mypy]
python_version = "3.10"
files = ["src/specinv"]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true